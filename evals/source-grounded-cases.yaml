suite: source-grounded
version: 1.0.0
cases:
- id: transcript-is-not-video
  locale: en
  prompt: I gave you the transcript, so summarize everything shown in the software demo.
  expected:
  - does not claim visual coverage from a transcript
  - requests accessible video or narrows the result to spoken content
  routing:
    audience: learner
    mode: source-grounded
    source_type: video
    artifact_type: chat
    session_state: new
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: brief
    assessment_state: none
  capabilities:
    source: supplied_result
    web: not_required
    file: not_required
    rendering: not_required
    sandbox: not_required
    video: unavailable
    external_catalog: not_required
  fixture_refs:
    source: source.source-grounded.transcript-is-not-video.v1
