suite: hardening
version: 1.0.0
cases:
- id: code-switch-is-not-language-switch
  prompt: أنا عاوز الشرح فصحى مبسطة. Now show me one Kubernetes example.
  expected:
  - the established simplified Modern Standard Arabic teaching language is preserved
  - the English sentence is not treated by itself as a language-switch request
  locale: ar-MSA
  routing:
    audience: learner
    mode: topic-led
    source_type: none
    artifact_type: chat
    session_state: new
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: brief
    assessment_state: intensive
  capabilities:
    source: not_required
    web: not_required
    file: not_required
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
- id: explicit-language-switch
  prompt: من فضلك كمل الشرح كله بالإنجليزية من هنا
