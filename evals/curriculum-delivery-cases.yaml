    web: not_required
    file: executable_temp
    rendering: not_required
    sandbox: not_required
    video: supplied_result
    external_catalog: not_required
  fixture_refs:
    source: source.curriculum-delivery.traceable-modular-course.v1
    file: file.disposable-workspace.v1
    video: video.curriculum-delivery.traceable-modular-course.v1
    context: context.curriculum-delivery.traceable-modular-course.v1
