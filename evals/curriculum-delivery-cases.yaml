suite: curriculum-delivery
version: 1.0.0
cases:
- id: whole-book-artifact-first
  prompt: اشرح لي الكتاب كله بالتفصيل بالعربية الفصحى المبسطة
  expected:
  - a navigable Markdown or requested PDF curriculum is created before a long lesson
  - the chat response is a short orientation rather than an unstructured lecture
  - the curriculum is divided into modules and lessons with demonstrable outcomes
  locale: ar-MSA
  routing:
    audience: learner
    mode: source-grounded
    source_type: book
    artifact_type: curriculum
    session_state: new
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: substantial
    assessment_state: none
  capabilities:
    source: supplied_result
    web: not_required
    file: executable_temp
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
  fixture_refs:
    source: source.curriculum-delivery.whole-book-artifact-first.v1
    file: file.disposable-workspace.v1
    context: context.curriculum-delivery.whole-book-artifact-first.v1
- id: markdown-default-ltr
  prompt: Teach me this broad field from zero; I did not choose a file format.
  expected:
  - an editable Markdown curriculum is the default artifact
  - the learner is not blocked by an unnecessary format question
  locale: en
  routing:
    audience: learner
    mode: topic-led
    source_type: none
    artifact_type: curriculum
    session_state: new
    domain_pack: none
    accessibility: standard
