    web: not_required
    file: executable_temp
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
  fixture_refs:
    file: file.disposable-workspace.v1
- id: arabic-pdf-quality
  prompt: اعمل المنهج PDF عربي جاهز للطباعة
  expected:
  - the PDF uses readable right-to-left Arabic and preserves technical terms
  - the rendered pages are inspected before delivery
  - the PDF is generated from the validated bidirectional source rather than maintained as separate content
  locale: ar-MSA
  routing:
    audience: learner
    mode: source-grounded
