  capabilities:
    source: not_required
    web: not_required
    file: executable_temp
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
  fixture_refs:
    file: file.disposable-workspace.v1
- id: html-default-arabic-bidi
  prompt: اشرح لي distributed systems بالعربي وفيه المصطلحات الإنجليزية
  expected:
  - semantic HTML is the default learner-facing source
  - English terms, identifiers, numbers, URLs, and code are directionally isolated
  - the agent does not rely on Markdown backticks alone for bidirectional correctness
  locale: ar-MSA
  routing:
    audience: learner
    mode: topic-led
    source_type: none
    artifact_type: html
    session_state: new
    domain_pack: none
    accessibility: standard
