  prompt: Turn this book and supporting videos into a detailed course.
  expected:
  - stable curriculum, module, lesson, objective, and source identifiers connect the artifacts
  - each lesson includes source references, practice, and assessment evidence
  - large lesson prose is split into linked files instead of one oversized artifact
