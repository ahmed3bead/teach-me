    sandbox: not_required
    video: not_required
    external_catalog: not_required
  fixture_refs:
    source: source.curriculum-delivery.arabic-pdf-quality.v1
    file: file.disposable-workspace.v1
    rendering: rendering.pdf-from-html.v1
