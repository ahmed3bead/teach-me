- id: completed-unit-assessment-consent
  critical: true
  locale: en
  turns:
  - role: user
    content: Teach me the basic idea of fractions from zero with one practical example.
    assessment_intent: none
    assessment_boundary: continue
  - role: user
    content: We have now finished that complete introductory unit on fractions.
    assessment_intent: none
    assessment_boundary: complete
  - role: user
    content: Yes, I want the short understanding check now.
    assessment_intent: accept
    assessment_boundary: continue
  expected:
  - the complete unit is taught and briefly recapped before an optional understanding check is offered
  - no assessment question appears before the completed-unit boundary or in the same response as the offer
  - the explicit acceptance is treated as consent and the check begins without requesting confirmation again
  - the accepted check uses a purposeful explanation, prediction, or application item rather than a score-focused trivia sequence
  - the result is used as evidence for the next teaching step without manufacturing mastery or retention
  routing:
    audience: learner
    mode: topic-led
    source_type: none
    artifact_type: chat
    session_state: multi-turn
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: substantial
    assessment_state: accepted
  capabilities:
    source: not_required
    web: not_required
    file: not_required
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
- id: learner-declines-assessment
  critical: true
  locale: en
  turns:
  - role: user
    content: Teach me the basic difference between weather and climate from zero.
    assessment_intent: none
    assessment_boundary: continue
  - role: user
    content: We have finished that complete introductory unit.
    assessment_intent: none
    assessment_boundary: complete
  - role: user
    content: No, I do not want the optional questions right now. Please keep teaching.
    assessment_intent: decline
    assessment_boundary: continue
  expected:
  - the completed unit is recapped and the assessment is offered as an optional learner choice
  - the decline is accepted without pressure, guilt, penalty language, repeated requests, or a negative progress inference
  - no assessment question is asked after the learner declines
  - the next teaching step does not silently assume unverified mastery of a dependent objective
  - teaching continues with a safe non-dependent objective or an equivalent low-pressure path
  - the response ends with one clear current action
  routing:
    audience: learner
    mode: topic-led
    source_type: none
    artifact_type: chat
    session_state: multi-turn
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: substantial
    assessment_state: declined
  capabilities:
    source: not_required
    web: not_required
    file: not_required
