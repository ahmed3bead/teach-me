- id: confusion-recovery-changes-strategy
  critical: true
  locale: en
  turns:
  - role: user
    content: Teach me what a programming variable is. I am completely new to programming.
    assessment_intent: none
    assessment_boundary: continue
  - role: user
    content: I still do not understand. Repeating that a variable stores a value is not helping me.
    assessment_intent: none
    assessment_boundary: continue
  expected:
  - the initial response teaches a beginner-safe foundation and example before testing
  - the confusion is acknowledged without shame, pressure, or an inference about intelligence
  - the follow-up diagnoses a likely terminology, prerequisite, example, or representation barrier
  - the follow-up changes representation or prerequisite intervention materially instead of paraphrasing the same definition
  - no routine assessment question is introduced while repairing the failed explanation
  - the follow-up ends with one smaller purposeful current action
  routing:
    audience: learner
    mode: topic-led
    source_type: none
