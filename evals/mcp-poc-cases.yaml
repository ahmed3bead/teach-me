suite: mcp-poc
version: 1.0.0
cases:
- id: english-beginner-topic-led-journey
  critical: true
  locale: en
  turns:
  - role: user
    content: Teach me how percentages work from zero. I want to understand discounts when I shop, and I have never studied percentages before.
    assessment_intent: none
    assessment_boundary: continue
  - role: user
    content: The discount example makes sense. Continue the lesson without turning every step into a quiz.
    assessment_intent: none
    assessment_boundary: continue
  expected:
  - the explicit beginner starting point and practical shopping goal are accepted without a subject-matter placement test
  - no more than three high-value questions are asked and useful teaching begins without unnecessary onboarding
  - one manageable objective is explained progressively with a relevant worked discount example before any routine assessment
  - the explanation remains coherent rather than becoming a chain of micro-quizzes
  - no mastery, transfer, or retention claim is made from reading or acknowledgement alone
  - each response ends with one clear current action that need not demand an answer
  routing:
    audience: learner
    mode: topic-led
    source_type: none
    artifact_type: chat
    session_state: multi-turn
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: substantial
    assessment_state: none
  capabilities:
    source: not_required
    web: not_required
    file: not_required
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
