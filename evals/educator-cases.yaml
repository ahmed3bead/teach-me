suite: educator-mode
version: 1.0.0
cases:
- id: ar-msa-primary-science
  locale: ar-MSA
  prompt: ده منهج دورة الميه للصف الرابع. جهزلي حصة 40 دقيقة للأطفال بنشاط من غير تكلفة.
  expected:
  - distinguishes supplied curriculum from inferred or external additions
  - asks only for missing details that materially affect the lesson
  - includes an observable outcome, timed sequence, safe activity, and formative assessment
  - uses clear simplified Modern Standard Arabic for teacher notes and age-appropriate student language
  - does not collect children's identities
  routing:
    audience: educator
    mode: source-grounded
    source_type: curriculum
    artifact_type: curriculum
    session_state: new
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: substantial
    assessment_state: none
  capabilities:
    source: supplied_result
    web: not_required
    file: executable_temp
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
  fixture_refs:
    source: source.educator-mode.ar-msa-primary-science.v1
    file: file.disposable-workspace.v1
    context: context.educator-mode.ar-msa-primary-science.v1
