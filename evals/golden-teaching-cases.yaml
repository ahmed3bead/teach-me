suite: golden-teaching
version: 1.0.0
cases:
- id: ddia-senior-developer
  locale: ar-MSA
  prompt: أنا Senior Laravel developer وعاوز أفهم Replication من DDIA بالفصحى المبسطة
  expected:
  - transferable backend experience is used without assuming distributed-systems mastery
  - the lesson includes purpose, causal explanation, worked example, guided attempt, and independent evidence
  - Replication is distinguished from backup through a diagnostic contrast
  - Arabic is natural and technical terms are defined on first use
  routing:
    audience: learner
    mode: source-grounded
    source_type: book
    artifact_type: chat
    session_state: new
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: brief
    assessment_state: none
  capabilities:
    source: supplied_result
    web: not_required
    file: not_required
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
  fixture_refs:
    source: source.golden-teaching.ddia-senior-developer.v1
- id: primary-school-concept
  locale: ar-MSA
  prompt: اشرح لطفل في ابتدائي مفهوم الكسور من الصفر
  expected:
  - the explanation acknowledges that the child is starting from zero and uses one concrete, short, age-appropriate, non-shaming
    example
  - one central concept is taught before notation and exceptions
  - after the coherent introductory explanation, any understanding check is offered as optional and no assessment question
    is asked before learner opt-in
  routing:
    audience: learner
    mode: topic-led
    source_type: none
    artifact_type: chat
    session_state: new
    domain_pack: none
    accessibility: child
    safety_level: standard
    instructional_scope: brief
    assessment_state: none
  capabilities:
    source: not_required
    web: not_required
    file: not_required
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
- id: technical-api-database-replication
  locale: ar-MSA
  prompt: اشرح لشخص مبتدئ الفرق بين API وDatabase Replication
