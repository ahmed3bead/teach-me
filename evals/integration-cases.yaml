suite: integration-core
version: 1.0.0
cases:
- id: learner-book-connected-flow
  prompt: علّمني من الكتاب المرفق وسجّل تقدمي عشان نكمل بكرة.
  expected:
  - audience and input mode are represented independently
  - source coverage is linked to an objective through stable identifiers
  - reading or lesson completion is not recorded as mastery
  - the checkpoint contains evidence and a next action
  locale: ar-MSA
  routing:
    audience: learner
    mode: source-grounded
    source_type: book
    artifact_type: chat
    session_state: new
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: brief
    assessment_state: none
  capabilities:
    source: supplied_result
    web: not_required
    file: not_required
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
  fixture_refs:
    source: source.integration-core.learner-book-connected-flow.v1
- id: educator-video-combination
  prompt: حوّل الفيديو ده لخطة حصة للمدرس، ومعاه تقييم للطلبة.
  expected:
  - educator and source-grounded handling are combined
  - source capability and coverage are established before the plan
  - lesson outcomes and assessment trace to inspected source locations
  locale: ar-MSA
  routing:
