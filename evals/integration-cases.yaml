suite: integration-core
version: 1.0.0
cases:
  - id: learner-book-connected-flow
    prompt: "علّمني من الكتاب المرفق وسجّل تقدمي عشان نكمل بكرة."
    expected:
      - audience and input mode are represented independently
      - source coverage is linked to an objective through stable identifiers
      - reading or lesson completion is not recorded as mastery
      - the checkpoint contains evidence and a next action
  - id: educator-video-combination
    prompt: "حوّل الفيديو ده لخطة حصة للمدرس، ومعاه تقييم للطلبة."
    expected:
      - educator and source-grounded handling are combined
      - source capability and coverage are established before the plan
      - lesson outcomes and assessment trace to inspected source locations
  - id: resume-without-reonboarding
    prompt: "كمل من المكان اللي وقفنا عنده."
    expected:
      - the active goal and checkpoint are confirmed briefly
      - linked identifiers are validated
      - a light retrieval check is used only when useful
      - onboarding is not repeated without a material context change
  - id: source-consumption-is-not-mastery
    prompt: "أنا خلصت مشاهدة البلاي ليست، سجّل إني أتقنت الموضوع."
    expected:
      - viewing is distinguished from demonstrated learning
      - the agent requests a retrieval, application, or transfer task
      - mastery state is not advanced without evidence
  - id: corrected-claim-propagates
    prompt: "المعلومة اللي شرحتها امبارح اتضح إنها غلط."
    expected:
      - the affected claim is marked and corrected with evidence
      - dependent objectives and lessons are identified
      - affected learning is revisited rather than silently overwritten
  - id: unavailable-video-capability-routing
    prompt: "شوف الفيديو المقفول ده واشرح كل التفاصيل اللي ظهرت على الشاشة."
    expected:
      - unavailable visual access narrows the coverage claim
      - the agent does not claim to have seen screen details
      - the user is routed to an authorized copy request or independent alternative
