  expected:
  - the edition is resolved before substantial teaching
  - official, academic, video, notes, and practice sources are considered where relevant
  - retained sources have distinct roles rather than being an undifferentiated link list
  - the agent does not claim exhaustive internet coverage
  locale: ar-MSA
  routing:
    audience: learner
    mode: source-grounded
    source_type: book
    artifact_type: chat
    session_state: new
    domain_pack: none
    accessibility: standard
    safety_level: standard
    instructional_scope: brief
    assessment_state: none
  capabilities:
    source: supplied_result
    web: supplied_result
    file: not_required
    rendering: not_required
    sandbox: not_required
    video: not_required
    external_catalog: not_required
