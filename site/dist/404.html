<!doctype html>
<html lang="ar" dir="rtl">

        display: inline-flex;
        min-height: 50px;
        align-items: center;
        padding: 0.7rem 1.3rem;

        color: #07152f;
        background: #ffcb57;

        font-weight: 800;
      }
    </style>
