- id: distinguish-image-failures
  locale: en
  prompt: My image looks wrong. Tell me the one setting that fixes every problem.
  expected:
  - brightness, focus error, camera motion, subject motion, and composition are not collapsed into one cause
  - one observable comparison narrows the cause before advice
