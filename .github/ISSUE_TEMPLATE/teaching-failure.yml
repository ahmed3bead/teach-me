name: Teaching failure
description: Report a reproducible teaching, evidence, language, or educator-mode failure without personal data.
title: "[Teaching failure]: "
labels: ["teaching-failure"]
body:
  - type: markdown
    attributes:
      value: "Do not paste private learner transcripts, student names, contact details, or protected curriculum content."
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Learner, Educator]
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Expected teaching output language
      description: Your original request may have been written in any Arabic dialect; choose the language the teaching response should have used.
      options:
        - Simplified Modern Standard Arabic
        - English
        - Mixed Arabic/English technical content
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Minimal reproducible request
      description: Remove personal and copyrighted material.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version
      placeholder: v1.0.0
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal data and content I am not authorized to share.
          required: true
